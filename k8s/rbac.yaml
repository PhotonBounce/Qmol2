apiVersion: v1
kind: ServiceAccount
metadata:
  name: qmol-sa
  namespace: qmol
  labels:
    app.kubernetes.io/name: qmol
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qmol-role
  namespace: qmol
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["qmol-secrets"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qmol-role-binding
  namespace: qmol
subjects:
  - kind: ServiceAccount
    name: qmol-sa
    namespace: qmol
roleRef:
  kind: Role
  name: qmol-role
  apiGroup: rbac.authorization.k8s.io
