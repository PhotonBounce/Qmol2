<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Job Completed</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; color: #1f2937; }
      .container { max-width: 600px; margin: 0 auto; padding: 24px; }
      .header { background: #4f46e5; color: #fff; padding: 24px; border-radius: 8px 8px 0 0; }
      .content { background: #fff; padding: 24px; border: 1px solid #e5e7eb; border-top: none; border-radius: 0 0 8px 8px; }
      .btn { display: inline-block; background: #4f46e5; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 6px; }
      .footer { margin-top: 24px; font-size: 12px; color: #6b7280; text-align: center; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 style="margin:0; font-size:20px;">ComputeSwarm</h1>
      </div>
      <div class="content">
        <h2>Your Job is Complete</h2>
        <p>Hi there,</p>
        <p>Your job <strong>{{ job_name }}</strong> has completed successfully.</p>
        <p>You can download the results from the dashboard or via the API.</p>
        <p style="margin-top:24px;">
          <a class="btn" href="{{ dashboard_url }}">Go to Dashboard</a>
        </p>
        <p style="margin-top:24px;">Thanks for using ComputeSwarm!</p>
      </div>
      <div class="footer">
        ComputeSwarm — Distributed Scientific Computing<br/>
        <a href="https://github.com/your-org/compute-swarm">GitHub</a>
      </div>
    </div>
  </body>
</html>
