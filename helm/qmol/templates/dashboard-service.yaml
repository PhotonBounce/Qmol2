apiVersion: v1
kind: Service
metadata:
  name: {{ include "qmol.fullname" . }}-dashboard
  labels:
    {{- include "qmol.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.service.dashboard.type }}
  ports:
    - port: {{ .Values.service.dashboard.port }}
      targetPort: {{ .Values.service.dashboard.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "qmol.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
