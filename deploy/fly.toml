app = "qmol"
primary_region = "iad"

[build]
  dockerfile = "deploy/lite.Dockerfile"

[env]
  USE_POSTGRES = "false"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "qmol_data"
  destination = "/app/data"
