apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qmol.fullname" . }}-secrets
  labels:
    {{- include "qmol.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.auth.existingSecret }}
  # PostgreSQL password is managed by an external secret
  {{- else if .Values.postgres.auth.password }}
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 24 | quote }}
  {{- end }}
  qmol-admin-token: {{ .Values.secrets.qmol_admin_token | default (randAlphaNum 32) | quote }}
  stripe-secret-key: {{ .Values.secrets.stripe_secret_key | quote }}
  stripe-webhook-secret: {{ .Values.secrets.stripe_webhook_secret | quote }}
  mailgun-api-key: {{ .Values.secrets.mailgun_api_key | quote }}
  mailgun-domain: {{ .Values.secrets.mailgun_domain | quote }}
  mailgun-from: {{ .Values.secrets.mailgun_from | quote }}
  hf-token: {{ .Values.secrets.hf_token | quote }}
  hf-repo-id: {{ .Values.secrets.hf_repo_id | quote }}
  ibm-quantum-token: {{ .Values.secrets.ibm_quantum_token | quote }}
  aws-braket-role-arn: {{ .Values.secrets.aws_braket_role_arn | quote }}
