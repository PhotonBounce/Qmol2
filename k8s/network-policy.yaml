apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qmol-quantum-worker-network-policy
  namespace: qmol
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qmol
      app.kubernetes.io/component: quantum-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # IBM Quantum, AWS Braket, etc.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
