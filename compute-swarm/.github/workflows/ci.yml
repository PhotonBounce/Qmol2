          echo "TODO: add ruff"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd dashboard
          npm ci

      - name: Build frontend
        run: |
          cd dashboard
          npm run build

