apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "qmol.fullname" . }}-test-connection"
  labels:
    {{- include "qmol.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['-qO-', '{{ include "qmol.fullname" . }}-api:80/health']
  restartPolicy: Never
