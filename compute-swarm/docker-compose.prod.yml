# ============================================================================
# ComputeSwarm — Production Docker Compose
# ============================================================================
# Designed for a single VPS deployment with:
#   • Traefik reverse proxy + Let's Encrypt SSL (auto-renewal)
#   • PostgreSQL (internal, no host port exposed)
#   • Redis (internal, no host port exposed)
#   • MinIO (internal, no host port exposed)
#   • FastAPI backend (production Dockerfile, resource limits)
#   • React dashboard (nginx static server)
#   • Worker (example local worker — privileged for Docker-in-Docker)
#
# Prerequisites:
#   1. Docker + Docker Compose plugin installed
#   2. .env file created from .env.prod.example
#   3. DNS A records pointing to this VPS for API_DOMAIN and APP_DOMAIN
#   4. Ports 80 and 443 open in the firewall
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # Traefik — Reverse Proxy & SSL Termination
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: computeswarm-traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - computeswarm-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # PostgreSQL — Relational Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: computeswarm-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: computeswarm
      POSTGRES_USER: ${DB_USER:-computeswarm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-computeswarm} -d computeswarm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - computeswarm-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    # No ports exposed to host — only internal network access

  # ---------------------------------------------------------------------------
  # Redis — Cache, Queue, Pub/Sub
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: computeswarm-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - computeswarm-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    # No ports exposed to host

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: computeswarm-minio
    restart: unless-stopped
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - computeswarm-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    # Only internal access; console not exposed to host

  # ---------------------------------------------------------------------------
  # API — FastAPI Orchestrator Backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: computeswarm-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - computeswarm-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=computeswarm-network"
      - "traefik.http.routers.api.rule=Host(`${API_DOMAIN:-api.yourdomain.com}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=api-ratelimit@file,security-headers@file"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Dashboard — React SPA served by Nginx
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: computeswarm-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - computeswarm-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=computeswarm-network"
      - "traefik.http.routers.dashboard.rule=Host(`${APP_DOMAIN:-app.yourdomain.com}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.middlewares=compress@file,security-headers@file"
      - "traefik.http.services.dashboard.loadbalancer.server.port=80"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Worker — Example Local Worker (single-host VPS)
  # ---------------------------------------------------------------------------
  # WARNING: privileged=true + docker.sock mount is required for
  # Docker-in-Docker sibling container spawning. In a multi-host or
  # Kubernetes deployment, workers should run on separate machines with
  # rootless Docker or dedicated Docker VMs.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: computeswarm-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL}
    networks:
      - computeswarm-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Optional: Log aggregator (future — Loki/Fluentd)
  # Uncomment below to send container logs to Loki.
  # ---------------------------------------------------------------------------
  # loki:
  #   image: grafana/loki:2.9.0
  #   container_name: computeswarm-loki
  #   restart: unless-stopped
  #   volumes:
  #     - loki_data:/loki
  #     - ./loki-config.yml:/etc/loki/local-config.yaml:ro
  #   command: -config.file=/etc/loki/local-config.yaml
  #   networks:
  #     - computeswarm-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  letsencrypt_data:
  # loki_data:

networks:
  computeswarm-network:
    driver: bridge
