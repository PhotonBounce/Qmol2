services:
  db:
    image: postgres:15
    container_name: computeswarm-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: computeswarm
      POSTGRES_USER: computeswarm
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U computeswarm -d computeswarm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - computeswarm-network

  redis:
    image: redis:7
    container_name: computeswarm-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - computeswarm-network

  minio:
    image: minio/minio:latest
    container_name: computeswarm-minio
    restart: unless-stopped
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - computeswarm-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: computeswarm-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://computeswarm:changeme@db:5432/computeswarm
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - computeswarm-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: computeswarm-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - computeswarm-network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: computeswarm-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # privileged is required for Docker-in-Docker sibling container spawning.
    # In production, prefer using a rootless Docker setup or a dedicated Docker VM.
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - ORCHESTRATOR_URL=http://api:8000
    networks:
      - computeswarm-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  computeswarm-network:
    driver: bridge
