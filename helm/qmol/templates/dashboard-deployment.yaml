apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qmol.fullname" . }}-dashboard
  labels:
    {{- include "qmol.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.replicaCount.dashboard }}
  selector:
    matchLabels:
      {{- include "qmol.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      annotations:
        {{- include "qmol.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "qmol.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "qmol.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          image: "nginx:alpine"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
            - name: static
              mountPath: /usr/share/nginx/html
          resources:
            {{- toYaml .Values.resources.dashboard | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "qmol.fullname" . }}-dashboard-config
        - name: static
          configMap:
            name: {{ include "qmol.fullname" . }}-dashboard-static
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qmol.fullname" . }}-dashboard-config
  labels:
    {{- include "qmol.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name localhost;
      root /usr/share/nginx/html;
      index index.html;
      location / {
        try_files $uri $uri/ /index.html;
      }
      gzip on;
      gzip_types text/plain text/css application/json application/javascript;
    }
