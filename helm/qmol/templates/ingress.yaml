{{- if .Values.ingress.enabled }}
{{- $fullName := include "qmol.fullname" . }}
{{- $svcApi := printf "%s-api" $fullName }}
{{- $svcDashboard := printf "%s-dashboard" $fullName }}
{{- $svcFlower := printf "%s-flower" $fullName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "qmol.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .service "api" }}
                name: {{ $svcApi }}
                {{- else if eq .service "dashboard" }}
                name: {{ $svcDashboard }}
                {{- else if eq .service "flower" }}
                name: {{ $svcFlower }}
                {{- else }}
                name: {{ $svcApi }}
                {{- end }}
                port:
                  number: 80
          {{- end }}
    {{- end }}
{{- end }}
