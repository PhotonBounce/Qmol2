services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: qmol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qmol}
      POSTGRES_DB: qmol
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Only expose to localhost for security; use Docker network internally
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qmol"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-qmol-redis-pass}
    # Only expose to localhost for security
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-qmol-redis-pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qmol:
    build: .
    image: qmol-api:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - USE_POSTGRES=true
      - DATABASE_URL=postgresql+asyncpg://qmol:${POSTGRES_PASSWORD:-qmol}@postgres:5432/qmol
      - REDIS_URL=redis://:${REDIS_PASSWORD:-qmol-redis-pass}@redis:6379/0
      - QMOL_ADMIN_TOKEN=${QMOL_ADMIN_TOKEN:?Admin token must be set}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_FROM=${MAILGUN_FROM:-Q-Mol <hi@yourdomain.com>}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
    volumes:
      - qmol-data:/data
      - ./logs:/app/logs
      - ./jobs:/app/jobs

  worker:
    build: .
    image: qmol-api:latest
    command: celery -A src.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      - redis
      - postgres
    environment:
      - USE_POSTGRES=true
      - DATABASE_URL=postgresql+asyncpg://qmol:${POSTGRES_PASSWORD:-qmol}@postgres:5432/qmol
      - REDIS_URL=redis://:${REDIS_PASSWORD:-qmol-redis-pass}@redis:6379/0
    volumes:
      - qmol-data:/data
      - ./logs:/app/logs
      - ./jobs:/app/jobs
      - ./models:/app/models

  flower:
    build: .
    image: qmol-api:latest
    command: celery -A src.celery_app flower --port=5555 --basic-auth=admin:${FLOWER_PASSWORD:-flower}
    # Only expose to localhost for security
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-qmol-redis-pass}@redis:6379/0

volumes:
  postgres-data:
  redis-data:
  qmol-data:
