apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qmol-api-metrics
  namespace: qmol
  labels:
    app.kubernetes.io/name: qmol
    app.kubernetes.io/component: api
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: qmol
      app.kubernetes.io/component: api
  namespaceSelector:
    matchNames:
      - qmol
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
